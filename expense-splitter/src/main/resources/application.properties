spring.application.name=ExpenseSplitter
# Database Configuration (Overrides via ENV for Cloud/Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/expense_splitter_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Auth0 Configuration (Secrets via ENV)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-placeholder.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE:https://expensesplitter.api}

# Application Settings
app.currency.code=INR
app.currency.symbol=\u20B9
